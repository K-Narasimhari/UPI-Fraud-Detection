<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings | UPI Fraud Detection System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        obsidian: '#0a0a0c',
                        coal: '#121216',
                        'neon-blue': '#00f2ff',
                        'electric-indigo': '#6366f1',
                        'cyber-rose': '#ff2d55',
                        'emerald-safe': '#10b981',
                    }
                }
            }
        }
    </script>
</head>

<body class="min-h-screen flex items-center justify-center p-6 bg-obsidian relative">
    <!-- Background circuit pattern -->
    <div class="absolute inset-0 z-0 opacity-10 pointer-events-none">
        <svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <pattern id="grid-settings" width="60" height="60" patternUnits="userSpaceOnUse">
                    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#6366f1" stroke-width="0.5" />
                </pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#grid-settings)" />
        </svg>
    </div>

    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-neon-blue/10 rounded-full blur-[120px]"></div>

    <div class="max-w-xl w-full z-10">
        <div class="text-center mb-10">
            <div
                class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-neon-blue to-electric-indigo rounded-[1.5rem] mb-6 shadow-2xl">
                <i class="fas fa-cog text-obsidian text-2xl"></i>
            </div>
            <h1 class="text-4xl font-black text-white tracking-tight">Identity Parameters</h1>
            <p class="text-slate-500 font-bold mt-2 uppercase tracking-[0.2em] text-[10px]">Secure Profile Configuration
            </p>
        </div>

        <div
            class="glass-card p-10 rounded-[3rem] shadow-3xl border border-white/5 relative overflow-hidden bg-white/5">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-neon-blue to-electric-indigo opacity-50">
            </div>

            <form method="POST" class="space-y-8">
                <div class="grid md:grid-cols-2 gap-8">
                    <!-- Display Name -->
                    <div>
                        <label
                            class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-3">Display
                            Label</label>
                        <div class="relative">
                            <input type="text" name="name" value="{{ user.name }}" required
                                class="w-full px-6 py-4 bg-black/20 border border-white/10 rounded-2xl outline-none focus:border-neon-blue transition-all text-white font-bold">
                        </div>
                    </div>

                    <!-- Mobile Number -->
                    <div>
                        <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-3">Linked
                            Cell</label>
                        <div class="relative">
                            <input type="tel" name="phone" value="{{ user.phone or '' }}" placeholder="+91 98765 43210"
                                required
                                class="w-full px-6 py-4 bg-black/20 border border-white/10 rounded-2xl outline-none focus:border-neon-blue transition-all text-white font-bold mono">
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-3">Auth
                        Cipher <span class="text-slate-600 font-normal lowercase">(Leave null to
                            preserve)</span></label>
                    <input type="password" name="password" placeholder="••••••••"
                        class="w-full px-6 py-4 bg-black/20 border border-white/10 rounded-2xl outline-none focus:border-cyber-rose transition-all text-white font-bold font-mono tracking-widest">
                </div>

                <!-- Transaction PIN -->
                <div class="pt-8 border-t border-white/5">
                    <div class="flex items-center gap-4 mb-4">
                        <div
                            class="w-10 h-10 bg-electric-indigo/10 border border-electric-indigo/20 rounded-xl flex items-center justify-center">
                            <i class="fas fa-key text-electric-indigo"></i>
                        </div>
                        <h3 class="text-sm font-black text-white uppercase tracking-wider">Delta PIN Override</h3>
                    </div>
                    <div class="relative">
                        <input type="password" name="pin" value="{{ user.pin }}" maxlength="4" pattern="\d{4}"
                            inputmode="numeric"
                            class="w-full px-6 py-5 bg-electric-indigo/5 border border-white/5 rounded-2xl outline-none focus:border-neon-blue transition-all text-neon-blue font-black mono text-2xl tracking-[0.5em] text-center">
                        <p class="mt-4 text-[10px] text-slate-600 font-bold uppercase tracking-widest text-center">
                            Legacy Default: 1234</p>
                    </div>
                </div>

                <div class="flex flex-col sm:flex-row gap-4 pt-4">
                    <a href="/dashboard/{{ user.id }}"
                        class="flex-1 py-5 bg-white/5 hover:bg-white/10 text-slate-400 font-black rounded-2xl transition-all border border-white/5 text-center text-xs uppercase tracking-widest">
                        ABORT
                    </a>
                    <button type="submit"
                        class="flex-[2] py-5 bg-neon-blue hover:bg-white text-obsidian font-black rounded-2xl transition-all shadow-[0_0_20px_rgba(0,242,255,0.2)] text-xs uppercase tracking-widest">
                        COMMIT CHANGES
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
