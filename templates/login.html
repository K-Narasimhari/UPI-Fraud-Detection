<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | UPI Fraud Detection System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        obsidian: '#0a0a0c',
                        coal: '#121216',
                        'neon-blue': '#00f2ff',
                        'electric-indigo': '#6366f1',
                    }
                }
            }
        }
    </script>
</head>

<body class="min-h-screen flex items-center justify-center p-6 bg-obsidian relative">

    <div class="absolute top-[-10%] right-[-10%] w-96 h-96 bg-neon-blue/10 rounded-full blur-[120px]"></div>
    <div class="absolute bottom-[-10%] left-[-10%] w-96 h-96 bg-electric-indigo/10 rounded-full blur-[120px]"></div>

    <div class="max-w-md w-full z-10">
        <!-- Logo/Header -->
        <div class="text-center mb-10">
            <div
                class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-neon-blue to-electric-indigo rounded-[1.5rem] mb-6 shadow-2xl relative group">
                <i class="fas fa-shield-alt text-obsidian text-3xl transition-transform group-hover:scale-110"></i>
                <div
                    class="absolute -inset-2 bg-neon-blue/20 rounded-3xl blur-xl opacity-0 group-hover:opacity-100 transition-opacity">
                </div>
            </div>
            <h1 class="text-4xl font-black text-white tracking-tight">Access Terminal</h1>
            <p class="text-slate-500 font-bold mt-2 uppercase tracking-[0.2em] text-[10px]">Authenticate Security
                Clearance</p>
        </div>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="mb-8 space-y-4 text-left">
            {% for category, message in messages %}
            <div
                class="p-5 rounded-2xl flex items-center space-x-4 glass shadow-2xl {{ 'bg-cyber-rose/10 text-cyber-rose border-cyber-rose/20' if category == 'danger' else 'bg-neon-blue/10 text-neon-blue border-neon-blue/20' }}">
                <i
                    class="fas {{ 'fa-exclamation-triangle' if category == 'danger' else 'fa-info-circle' }} text-xl"></i>
                <p class="text-sm font-black uppercase tracking-wide">{{ message }}</p>
            </div>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}

        <!-- Login Form -->
        <div
            class="glass-card p-10 rounded-[3rem] shadow-3xl border border-white/5 bg-white/5 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-neon-blue to-electric-indigo"></div>

            <form method="POST" class="space-y-8" autocomplete="off">
                <input style="display:none" type="text" name="fake_email" />
                <input style="display:none" type="password" name="fake_password" />

                <!-- Email Address -->
                <div>
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-3">Entity
                        Identifier</label>
                    <div class="relative group">
                        <span
                            class="absolute inset-y-0 left-0 pl-6 flex items-center text-slate-600 transition-colors group-focus-within:text-neon-blue">
                            <i class="far fa-envelope"></i>
                        </span>
                        <input type="email" name="email" placeholder="agent@sentinel.ai" required
                            class="w-full pl-14 pr-6 py-4 bg-black/20 border border-white/10 rounded-2xl outline-none focus:border-neon-blue transition-all text-white font-bold placeholder:text-slate-700">
                    </div>
                </div>

                <!-- Password -->
                <div>
                    <div class="flex justify-between mb-3">
                        <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Secret
                            Hash</label>
                        <a href="{{ url_for('forgot_password') }}"
                            class="text-[10px] font-black text-neon-blue uppercase tracking-widest hover:text-white transition-colors">Recover</a>
                    </div>
                    <div class="relative group">
                        <span
                            class="absolute inset-y-0 left-0 pl-6 flex items-center text-slate-600 transition-colors group-focus-within:text-neon-blue">
                            <i class="fas fa-lock"></i>
                        </span>
                        <input type="password" name="password" placeholder="••••••••" required
                            class="w-full pl-14 pr-6 py-4 bg-black/20 border border-white/10 rounded-2xl outline-none focus:border-neon-blue transition-all text-white font-bold font-mono tracking-widest placeholder:text-slate-700">
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit"
                    class="w-full py-5 bg-neon-blue hover:bg-white text-obsidian font-black rounded-2xl shadow-[0_0_20px_rgba(0,242,255,0.3)] transition-all transform active:scale-[0.98] text-xs uppercase tracking-widest">
                    INITIALIZE SESSION
                </button>
            </form>

            <div class="mt-10 pt-6 border-t border-white/5 text-center">
                <p class="text-xs text-slate-500 font-bold uppercase tracking-widest leading-relaxed">
                    Unregistered Agent?
                    <a href="/register" class="text-neon-blue hover:text-white transition-colors ml-1">Establish ID</a>
                </p>
            </div>
        </div>
    </div>

</body>

</html>
